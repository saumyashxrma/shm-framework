[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shm-framework"
version = "1.0.0"
description = "Leakage-free guided-wave damage assessment (O1) and fatigue-crack diagnosis/prognosis with conformal intervals (O2)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Saumya Sharma" }, { name = "Abhigyan Sharma" }, { name = "Madhuhan Shekhar" }]
dependencies = ["numpy", "scipy", "pandas", "scikit-learn", "matplotlib"]

[project.optional-dependencies]
o1-models = ["tensorflow"]
app = ["gradio"]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::sklearn.exceptions.ConvergenceWarning", "ignore::UserWarning"]
